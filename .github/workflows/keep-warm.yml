# Keeps the Render free-tier instance warm so /api/kkey find a hot browser.
# Set repo secret RENDER_URL to the service URL (e.g. https://kdramascraperapi.onrender.com).
# One always-warm service fits inside Render's 750 free hours/month.
# Manual trigger also available via the Actions tab.
name: keep-warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          if [ -z "${{ secrets.RENDER_URL }}" ]; then
            echo "RENDER_URL secret not set – skipping"
            exit 0
          fi
          curl -fsS --max-time 90 "${{ secrets.RENDER_URL }}/health"
