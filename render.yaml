services:
  - type: web
    name: kdramascraperapi
    runtime: node
    plan: free
    buildCommand: npm install && PLAYWRIGHT_BROWSERS_PATH=./.playwright-browsers npx playwright install chromium-headless-shell
    # Browsers live in ./.playwright-browsers (project dir) so the build and
    # runtime see the same path. PLAYWRIGHT_BROWSERS_PATH env below must match.
    # Headless shell needs no root/apt (unlike --with-deps, which Render blocks).
    # Lean alternative (no /api/kkey minting): npm install --omit=optional
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SOURCE_URL
        value: https://kisskh.do
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: ./.playwright-browsers
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SOURCE_URL
        value: https://kisskh.do
      # Optional – uncomment/set in dashboard after first deploy:
      # - key: KISSKH_STREAM_KEY
      #   sync: false
      # - key: KISSKH_SUB_KEY
      #   sync: false
      # - key: CACHE_CLEAR_TOKEN
      #   sync: false
